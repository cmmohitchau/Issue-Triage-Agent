[project]
name = "issue-triage-agent"
version = "0.1.0"
description = "Two-phase gated ReAct triage agent for GitHub issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langgraph>=0.2,<0.6",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_triage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["issue_triage_agent"]
mypy_path = "src"

[tool.uv]
default-groups = ["dev"]
